<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Tool 返回值的上下文边界</title>
  <desc id="desc">普通 Tool 把全量数据塞进 ToolMessage 会撑爆上下文；安全 Tool 只让摘要进消息，完整数据走 runtime 旁路，用 id 引用。</desc>
  <defs>
    <filter id="shadow" x="-14%" y="-14%" width="128%" height="128%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#3f4d55" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#74838a"/></marker>
    <marker id="arrowr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#5f8a72"/></marker>
    <style>
      .bg{fill:#fbf7ef}
      .title{font:700 35px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27343b}
      .sub{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66737b}
      .panel{fill:#fffdf8;stroke:#ded6ca;stroke-width:1.4;filter:url(#shadow)}
      .ph{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .box{filter:url(#shadow);stroke-width:1.3}
      .n{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .nt{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7a8790}
      .line{stroke:#74838a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .lineg{stroke:#5f8a72;stroke-width:2.2;fill:none;marker-end:url(#arrowr)}
      .warn{font:700 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#b3796a}
      .good{font:700 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#4f8a69}
      .footer{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#34454d}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="52" text-anchor="middle">Tool 能返回，不代表适合进 Agent 消息流</text>
  <text class="sub" x="640" y="86" text-anchor="middle">ToolMessage 会进入下一轮模型调用——它有多大，就有多少上下文压力。</text>

  <!-- 左：普通 Tool -->
  <rect class="panel" x="66" y="120" width="558" height="470" rx="26"/>
  <text class="ph" x="345" y="164" text-anchor="middle">普通 Tool：全量塞进 ToolMessage</text>

  <rect class="box" x="120" y="196" width="160" height="58" rx="14" fill="#edf3ef" stroke="#9fb5aa"/><text class="n" x="200" y="230" text-anchor="middle">query Tool</text>
  <path class="line" d="M280 225 H332"/>
  <rect class="box" x="336" y="192" width="240" height="66" rx="14" fill="#f4eae2" stroke="#d8b6a8"/><text class="n" x="456" y="220" text-anchor="middle">返回 500KB 全量 JSON</text><text class="nt" x="456" y="242" text-anchor="middle">几百条候选，一条不落</text>

  <rect class="box" x="200" y="316" width="300" height="64" rx="14" fill="#f7e6e0" stroke="#d8a98f"/><text class="n" x="350" y="344" text-anchor="middle">ToolMessage（超大）</text><text class="nt" x="350" y="366" text-anchor="middle">原样进入 messages</text>
  <path class="line" d="M456 258 C456 285, 380 295, 352 314"/>

  <rect class="box" x="200" y="430" width="300" height="64" rx="14" fill="#3a3f44" stroke="#2c3035"/><text class="n" x="350" y="458" text-anchor="middle" fill="#f1ede4">下一轮模型调用</text><text class="nt" x="350" y="480" text-anchor="middle" fill="#c9a0a0">带着这坨大 message 一起送</text>
  <path class="line" d="M350 380 V428"/>

  <text class="warn" x="345" y="540" text-anchor="middle">✗ 上下文被撑爆，费用飙升、还可能超限</text>

  <!-- 右：安全 Tool -->
  <rect class="panel" x="656" y="120" width="558" height="470" rx="26"/>
  <text class="ph" x="935" y="164" text-anchor="middle">安全 Tool：摘要进消息，完整走旁路</text>

  <rect class="box" x="710" y="196" width="150" height="58" rx="14" fill="#edf3ef" stroke="#9fb5aa"/><text class="n" x="785" y="230" text-anchor="middle">query Tool</text>

  <rect class="box" x="900" y="176" width="270" height="60" rx="14" fill="#eef1e9" stroke="#b4bfa9"/><text class="n" x="1035" y="203" text-anchor="middle">摘要：只留 5 条 + 统计</text><text class="nt" x="1035" y="224" text-anchor="middle">→ ToolMessage（很小）</text>
  <path class="line" d="M860 216 C878 208, 885 206, 898 206"/>

  <rect class="box" x="900" y="300" width="270" height="66" rx="14" fill="#e9eff7" stroke="#a1b3c8"/><text class="n" x="1035" y="328" text-anchor="middle">完整数据 → runtime 旁路</text><text class="nt" x="1035" y="350" text-anchor="middle">程序侧保存，不进 messages</text>
  <path class="lineg" d="M820 254 C830 300, 870 322, 898 330"/>

  <rect class="box" x="900" y="418" width="270" height="66" rx="14" fill="#eef1e9" stroke="#b4bfa9"/><text class="n" x="1035" y="446" text-anchor="middle">提交时按 candidate_id 找回</text><text class="nt" x="1035" y="468" text-anchor="middle">LLM 只传 id，程序取全量</text>
  <path class="lineg" d="M1035 366 V416"/>

  <text class="good" x="935" y="540" text-anchor="middle">✓ messages 保持轻量，完整数据一条不丢</text>

  <rect x="230" y="618" width="820" height="60" rx="18" fill="#ffffff" stroke="#d8cec1"/>
  <text class="footer" x="640" y="646" text-anchor="middle">原则：给 LLM 的（messages）要小；完整数据留在程序旁路（runtime），</text>
  <text class="footer" x="640" y="670" text-anchor="middle">用 id 引用，需要时再取回。</text>
</svg>
