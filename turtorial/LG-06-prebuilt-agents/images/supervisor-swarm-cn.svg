<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Supervisor 与 Swarm 的区别</title>
  <desc id="desc">对比 supervisor 中心调度和 swarm 平级交接两种多 Agent 预构建模式；并拆解一层说明专家本身也是图，supervisor / swarm 自己也是 CompiledStateGraph。</desc>
  <defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="124%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3f4d55" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#74838a"/></marker><style>.bg{fill:#fbf7ef}.title{font:700 40px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27343b}.sub{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66737b}.panel{fill:#fffdf8;stroke:#ded6ca;stroke-width:1.4;filter:url(#shadow)}.node{filter:url(#shadow);stroke-width:1.3}.h{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}.p{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#43525a}.api{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#687781}.line{stroke:#74838a;stroke-width:2;fill:none;marker-end:url(#arrow)}.footer{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#34454d}.step{font:700 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}.cap{font:500 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#43525a}</style></defs>
  <rect class="bg" width="1280" height="900"/>
  <text class="title" x="640" y="60" text-anchor="middle">多 Agent 预构建：一个是主管调度，一个是平级交接</text>
  <text class="sub" x="640" y="96" text-anchor="middle">两者都在把专家能力原子化，只是路由权放在不同位置</text>

  <text class="step" x="70" y="132">① 先看整体：两种拓扑</text>
  <rect class="panel" x="70" y="150" width="540" height="430" rx="30"/>
  <text class="h" x="340" y="198" text-anchor="middle">Supervisor：中心调度</text>
  <rect class="node" x="250" y="232" width="180" height="70" rx="22" fill="#edf3ef" stroke="#9fb5aa"/>
  <text class="h" x="340" y="261" text-anchor="middle">主管 Agent</text><text class="api" x="340" y="285" text-anchor="middle">supervisor</text>
  <rect class="node" x="120" y="392" width="130" height="62" rx="20" fill="#e9eff7" stroke="#a1b3c8"/><text class="p" x="185" y="429" text-anchor="middle">订单专员</text>
  <rect class="node" x="275" y="392" width="130" height="62" rx="20" fill="#f3ece4" stroke="#cfb79d"/><text class="p" x="340" y="429" text-anchor="middle">退款专员</text>
  <rect class="node" x="430" y="392" width="130" height="62" rx="20" fill="#f5e7e4" stroke="#d5aba3"/><text class="p" x="495" y="429" text-anchor="middle">技术专员</text>
  <path class="line" d="M300 303 C250 342, 215 362, 190 386"/><path class="line" d="M340 303 V386"/><path class="line" d="M380 303 C430 342, 465 362, 490 386"/>
  <text class="api" x="150" y="530">handoff 后回到 supervisor</text>

  <rect class="panel" x="670" y="150" width="540" height="430" rx="30"/>
  <text class="h" x="940" y="198" text-anchor="middle">Swarm：平级交接</text>
  <rect class="node" x="770" y="290" width="140" height="68" rx="22" fill="#e9eff7" stroke="#a1b3c8"/><text class="p" x="840" y="330" text-anchor="middle">Alice</text>
  <rect class="node" x="970" y="290" width="140" height="68" rx="22" fill="#f3ece4" stroke="#cfb79d"/><text class="p" x="1040" y="330" text-anchor="middle">Bob</text>
  <rect class="node" x="870" y="420" width="140" height="68" rx="22" fill="#f5e7e4" stroke="#d5aba3"/><text class="p" x="940" y="460" text-anchor="middle">Carol</text>
  <path class="line" d="M912 323 H964"/><path class="line" d="M1030 360 C1005 395, 980 408, 960 416"/><path class="line" d="M900 420 C872 395, 850 376, 840 362"/>
  <text class="api" x="760" y="530">active_agent 记录当前专员</text>

  <!-- ③ 再拆一层：套娃 -->
  <text class="step" x="70" y="636">② 再拆一层：这些专家本身也是一张图（套娃）</text>
  <rect class="panel" x="70" y="654" width="1140" height="168" rx="26"/>

  <rect class="node" x="110" y="708" width="130" height="60" rx="18" fill="#f3ece4" stroke="#cfb79d"/><text class="p" x="175" y="744" text-anchor="middle">退款专员</text>
  <path class="line" d="M244 738 H300"/><text class="api" x="272" y="726" text-anchor="middle">展开</text>

  <rect class="node" x="320" y="716" width="72" height="44" rx="14" fill="#ffffff" stroke="#d8d1c7"/><text class="api" x="356" y="743" text-anchor="middle">__start__</text>
  <rect class="node" x="430" y="710" width="104" height="56" rx="16" fill="#edf3ef" stroke="#9fb5aa"/><text class="p" x="482" y="744" text-anchor="middle">model</text>
  <rect class="node" x="576" y="710" width="104" height="56" rx="16" fill="#e9eff7" stroke="#a1b3c8"/><text class="p" x="628" y="744" text-anchor="middle">tools</text>
  <rect class="node" x="724" y="716" width="68" height="44" rx="14" fill="#ffffff" stroke="#d8d1c7"/><text class="api" x="758" y="743" text-anchor="middle">__end__</text>
  <path class="line" d="M392 738 H428"/>
  <path class="line" d="M534 724 C548 714, 562 714, 574 724"/>
  <path class="line" d="M576 752 C560 768, 450 768, 434 754"/>
  <path class="line" d="M680 738 H722"/>

  <text class="cap" x="838" y="710">supervisor / swarm 本身就是 CompiledStateGraph：</text>
  <text class="cap" x="838" y="738">· 每个专家 = 图里的一个节点</text>
  <text class="cap" x="838" y="766">· 节点内部又是 §4.5 那张 model / tools 循环</text>

  <rect x="210" y="846" width="860" height="44" rx="22" fill="#ffffff" stroke="#d8cec1"/>
  <text class="footer" x="640" y="875" text-anchor="middle">判断：任务分发用 supervisor；连续转接和平级协作用 swarm。</text>
</svg>
