<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">黑盒 invoke 与透明流式</title>
  <desc id="desc">invoke 是黑盒，用户白屏干等一次性结果；流式把过程实时推送给用户，消除等待焦虑。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3f4d55" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#74838a"/></marker>
    <style>
      .bg{fill:#fbf7ef}
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27343b}
      .sub{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66737b}
      .panel{fill:#fffdf8;stroke:#ded6ca;stroke-width:1.4;filter:url(#shadow)}
      .ph{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .box{filter:url(#shadow);stroke-width:1.3}
      .h{font:700 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .p{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#43525a}
      .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#687781}
      .feel{font:500 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#9a5b48}
      .feelg{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#4f8a69}
      .line{stroke:#74838a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .footer{font:700 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#34454d}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="56" text-anchor="middle">流式不是为了好看，是为了消除「等待焦虑」</text>
  <text class="sub" x="640" y="90" text-anchor="middle">点外卖最焦虑的不是等 30 分钟，而是不知道「外卖到哪了」。给图加流式，就是给它做「外卖追踪」。</text>

  <!-- 左：黑盒 invoke -->
  <rect class="panel" x="66" y="128" width="558" height="468" rx="28"/>
  <text class="ph" x="345" y="176" text-anchor="middle">invoke()：黑盒</text>

  <rect class="box" x="108" y="214" width="120" height="64" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
  <text class="p" x="168" y="252" text-anchor="middle">用户发问</text>
  <path class="line" d="M228 246 H276"/>
  <rect class="box" x="280" y="206" width="180" height="80" rx="18" fill="#3a3f44" stroke="#2c3035"/>
  <text class="h" x="370" y="240" text-anchor="middle" fill="#f1ede4">？？？</text>
  <text class="mono" x="370" y="266" text-anchor="middle" fill="#b9c0c5">几秒 ~ 几十秒</text>
  <path class="line" d="M460 246 H508"/>
  <rect class="box" x="512" y="214" width="96" height="64" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
  <text class="p" x="560" y="252" text-anchor="middle">最终结果</text>

  <rect x="108" y="330" width="474" height="106" rx="16" fill="#f7efe9" stroke="#e4cdbf"/>
  <text class="h" x="132" y="364">用户看到的：</text>
  <text class="feel" x="132" y="394">· 一直是白屏，不知道在干嘛</text>
  <text class="feel" x="132" y="420">· 不知道还要等多久、是不是卡死了</text>

  <text class="p" x="345" y="486" text-anchor="middle">中间每个节点执行、每个 token、每次进度，全被盖住了</text>
  <text class="mono" x="345" y="556" text-anchor="middle">result = graph.invoke(input)</text>

  <!-- 右：透明流式 -->
  <rect class="panel" x="656" y="128" width="558" height="468" rx="28"/>
  <text class="ph" x="935" y="176" text-anchor="middle">stream()：透明盒</text>

  <rect class="box" x="698" y="214" width="120" height="64" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
  <text class="p" x="758" y="252" text-anchor="middle">用户发问</text>
  <path class="line" d="M818 246 H862"/>
  <rect class="box" x="866" y="200" width="200" height="92" rx="18" fill="#edf3ef" stroke="#9fb5aa"/>
  <text class="p" x="966" y="228" text-anchor="middle">▸ 节点正在执行</text>
  <text class="p" x="966" y="252" text-anchor="middle">▸ token 逐字蹦出</text>
  <text class="p" x="966" y="276" text-anchor="middle">▸ 进度条 60%…</text>
  <path class="line" d="M1066 246 H1108"/>
  <rect class="box" x="1112" y="214" width="74" height="64" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
  <text class="p" x="1149" y="246" text-anchor="middle">边看</text>
  <text class="p" x="1149" y="268" text-anchor="middle">边生成</text>

  <rect x="698" y="330" width="474" height="106" rx="16" fill="#eef5f0" stroke="#bcd2c5"/>
  <text class="h" x="722" y="364">用户看到的：</text>
  <text class="feelg" x="722" y="394">· 实时看到「它在工作、到哪一步了」</text>
  <text class="feelg" x="722" y="420">· 有掌控感，等待焦虑被消解</text>

  <text class="p" x="935" y="486" text-anchor="middle">把「等结果」变成「看过程」——这就是这一章要做的事</text>
  <text class="mono" x="935" y="556" text-anchor="middle">for chunk in graph.stream(input, stream_mode=...)</text>

  <rect x="300" y="632" width="680" height="52" rx="26" fill="#ffffff" stroke="#d8cec1"/>
  <text class="footer" x="640" y="665" text-anchor="middle">同一张图，换个看法：invoke 等一个结果，stream 看整个过程。</text>
</svg>
