<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">链和图的区别</title>
  <desc id="desc">链是线性 A→B→C，图能分支、循环、并行，并让共享状态贯穿全程。</desc>
  <defs>
    <filter id="shadow" x="-14%" y="-14%" width="128%" height="128%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#3f4d55" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#74838a"/></marker>
    <style>
      .bg{fill:#fbf7ef}
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27343b}
      .sub{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66737b}
      .panel{fill:#fffdf8;stroke:#ded6ca;stroke-width:1.4;filter:url(#shadow)}
      .ph{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .box{filter:url(#shadow);stroke-width:1.3}
      .n{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .p{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#43525a}
      .warn{font:500 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#b3796a}
      .good{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#4f8a69}
      .line{stroke:#74838a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .stateband{fill:#eef5f0;stroke:#bcd2c5;stroke-width:1.3}
      .slab{font:700 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#4f7a63}
      .footer{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#34454d}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="54" text-anchor="middle">链是一条线，图是一张网</text>
  <text class="sub" x="640" y="88" text-anchor="middle">Chain 写死顺序 A→B→C；Graph 能分支、循环、并行，还让共享 State 贯穿全程。</text>

  <!-- 左：链 -->
  <rect class="panel" x="66" y="122" width="536" height="454" rx="26"/>
  <text class="ph" x="334" y="168" text-anchor="middle">Chain（链）：线性执行</text>

  <rect class="box" x="110" y="250" width="110" height="70" rx="18" fill="#f1ede4" stroke="#d8d1c7"/><text class="n" x="165" y="292" text-anchor="middle">A</text>
  <rect class="box" x="279" y="250" width="110" height="70" rx="18" fill="#f1ede4" stroke="#d8d1c7"/><text class="n" x="334" y="292" text-anchor="middle">B</text>
  <rect class="box" x="448" y="250" width="110" height="70" rx="18" fill="#f1ede4" stroke="#d8d1c7"/><text class="n" x="503" y="292" text-anchor="middle">C</text>
  <path class="line" d="M220 285 H275"/>
  <path class="line" d="M389 285 H444"/>

  <text class="warn" x="110" y="392">✗ 顺序写死，只有一条路</text>
  <text class="warn" x="110" y="428">✗ 分支 / 循环 / 并行都很别扭</text>
  <text class="warn" x="110" y="464">✗ 步骤之间没有共享工作台</text>
  <text class="warn" x="110" y="500">✗ 中途改流程，往往要重写</text>

  <!-- 右：图 -->
  <rect class="panel" x="646" y="122" width="568" height="454" rx="26"/>
  <text class="ph" x="930" y="168" text-anchor="middle">Graph（图）：分支 · 循环 · 并行</text>

  <rect class="box" x="690" y="214" width="96" height="56" rx="14" fill="#edf3ef" stroke="#9fb5aa"/><text class="p" x="738" y="248" text-anchor="middle">parse</text>
  <rect class="box" x="850" y="180" width="110" height="52" rx="14" fill="#e9eff7" stroke="#a1b3c8"/><text class="p" x="905" y="212" text-anchor="middle">建计划</text>
  <rect class="box" x="850" y="248" width="110" height="52" rx="14" fill="#e9eff7" stroke="#a1b3c8"/><text class="p" x="905" y="280" text-anchor="middle">查历史</text>
  <rect class="box" x="850" y="316" width="110" height="52" rx="14" fill="#e9eff7" stroke="#a1b3c8"/><text class="p" x="905" y="348" text-anchor="middle">澄清</text>
  <rect class="box" x="1020" y="214" width="96" height="56" rx="14" fill="#f4eae2" stroke="#d8b6a8"/><text class="p" x="1068" y="248" text-anchor="middle">END</text>
  <path class="line" d="M786 236 C815 214, 826 206, 848 206"/>
  <path class="line" d="M786 244 C815 260, 826 272, 848 274"/>
  <path class="line" d="M786 256 C815 320, 826 340, 848 342"/>
  <path class="line" d="M960 206 C990 214, 1000 240, 1018 244"/>
  <path class="line" d="M960 274 C990 266, 1000 254, 1018 250"/>

  <!-- 贯穿的 State band -->
  <rect class="stateband" x="690" y="404" width="480" height="52" rx="14"/>
  <text class="slab" x="710" y="435">共享 State：所有节点读同一份、写回同一份（贯穿全程）</text>

  <text class="good" x="690" y="498">✓ 条件边分流，普通边跑流水线</text>
  <text class="good" x="690" y="530">✓ Reducer 决定新数据是覆盖还是累加</text>

  <rect x="300" y="608" width="680" height="66" rx="18" fill="#ffffff" stroke="#d8cec1"/>
  <text class="footer" x="640" y="640" text-anchor="middle">五个核心概念：State（共享数据）· Node（处理步骤）· Edge（流转规则）</text>
  <text class="footer" x="640" y="664" text-anchor="middle">· Reducer（合并规则）· compile / invoke / stream（运行方式）</text>
</svg>
