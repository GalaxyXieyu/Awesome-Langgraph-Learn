<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">TravelPlannerBot 图结构</title>
  <desc id="desc">先用条件边按意图分流，创建计划分支再用普通边跑固定流水线。</desc>
  <defs>
    <filter id="shadow" x="-14%" y="-14%" width="128%" height="128%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3f4d55" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#74838a"/></marker>
    <marker id="arrowc" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#c08a5a"/></marker>
    <style>
      .bg{fill:#fbf7ef}
      .title{font:700 32px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27343b}
      .sub{font:400 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66737b}
      .box{filter:url(#shadow);stroke-width:1.3}
      .n{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .term{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5a6a72}
      .line{stroke:#74838a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .cond{stroke:#c08a5a;stroke-width:2.2;fill:none;marker-end:url(#arrowc);stroke-dasharray:6 5}
      .condlab{font:600 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#a5713f}
      .lg{font:600 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#5a6a72}
    </style>
  </defs>
  <rect class="bg" width="1280" height="640"/>
  <text class="title" x="640" y="52" text-anchor="middle">TravelPlannerBot：条件边分流 + 普通边跑流水线</text>
  <text class="sub" x="640" y="84" text-anchor="middle">所有请求先进 parse_request；虚线橙箭头是「条件边」（按意图选路），实线灰箭头是「普通边」（固定顺序）。</text>

  <!-- START -->
  <rect class="box" x="60" y="286" width="92" height="52" rx="26" fill="#ffffff" stroke="#d8d1c7"/><text class="term" x="106" y="317" text-anchor="middle">START</text>
  <!-- parse_request -->
  <rect class="box" x="192" y="276" width="150" height="72" rx="18" fill="#edf3ef" stroke="#9fb5aa"/><text class="n" x="267" y="308" text-anchor="middle">parse_request</text><text class="term" x="267" y="330" text-anchor="middle">意图识别</text>
  <path class="line" d="M152 312 H188"/>

  <!-- 分支 1: create_plan 流水线 -->
  <rect class="box" x="410" y="120" width="150" height="64" rx="16" fill="#e9eff7" stroke="#a1b3c8"/><text class="n" x="485" y="150" text-anchor="middle">extract_trip_info</text><text class="term" x="485" y="170" text-anchor="middle">提取信息</text>
  <rect class="box" x="612" y="120" width="120" height="64" rx="16" fill="#e9eff7" stroke="#a1b3c8"/><text class="n" x="672" y="150" text-anchor="middle">build_plan</text><text class="term" x="672" y="170" text-anchor="middle">生成计划</text>
  <rect class="box" x="784" y="120" width="110" height="64" rx="16" fill="#e9eff7" stroke="#a1b3c8"/><text class="n" x="839" y="150" text-anchor="middle">save_plan</text><text class="term" x="839" y="170" text-anchor="middle">累加保存</text>
  <rect class="box" x="946" y="120" width="110" height="64" rx="16" fill="#e9eff7" stroke="#a1b3c8"/><text class="n" x="1001" y="150" text-anchor="middle">reply_plan</text><text class="term" x="1001" y="170" text-anchor="middle">回复</text>

  <!-- 分支 2: show_history -->
  <rect class="box" x="450" y="286" width="150" height="64" rx="16" fill="#eef1e9" stroke="#b4bfa9"/><text class="n" x="525" y="316" text-anchor="middle">format_history</text><text class="term" x="525" y="336" text-anchor="middle">整理历史</text>
  <!-- 分支 3: clarify -->
  <rect class="box" x="450" y="440" width="170" height="64" rx="16" fill="#f4eae2" stroke="#d8b6a8"/><text class="n" x="535" y="470" text-anchor="middle">ask_clarification</text><text class="term" x="535" y="490" text-anchor="middle">请求澄清</text>

  <!-- END -->
  <rect class="box" x="1120" y="286" width="92" height="52" rx="26" fill="#ffffff" stroke="#d8d1c7"/><text class="term" x="1166" y="317" text-anchor="middle">END</text>

  <!-- 条件边（虚线橙）从 parse_request 分流 -->
  <path class="cond" d="M312 276 C350 220, 380 158, 406 154"/>
  <text class="condlab" x="322" y="210">create_plan</text>
  <path class="cond" d="M342 312 C380 316, 410 318, 446 318"/>
  <text class="condlab" x="360" y="300">show_history</text>
  <path class="cond" d="M322 344 C370 400, 400 460, 446 470"/>
  <text class="condlab" x="336" y="418">clarify</text>

  <!-- 普通边（实线灰）流水线 -->
  <path class="line" d="M560 152 H608"/>
  <path class="line" d="M732 152 H780"/>
  <path class="line" d="M894 152 H942"/>
  <!-- 汇聚到 END -->
  <path class="line" d="M1056 158 C1130 190, 1166 240, 1166 284"/>
  <path class="line" d="M600 318 C820 330, 1080 322, 1118 314"/>
  <path class="line" d="M620 476 C860 470, 1120 380, 1166 340"/>

  <!-- 图例 -->
  <line class="cond" x1="70" y1="560" x2="130" y2="560"/><text class="lg" x="140" y="565">条件边：按意图选路（router 决定去哪个分支）</text>
  <line class="line" x1="640" y1="560" x2="700" y2="560"/><text class="lg" x="710" y="565">普通边：固定顺序，一步接一步</text>
</svg>
