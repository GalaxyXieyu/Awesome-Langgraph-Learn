<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">图编排层 vs Agent 黑盒</title>
  <desc id="desc">其他框架以 Agent 为中心，传统业务只能包装成工具硬塞；LangGraph 是图编排层，传统业务和 AI 是平等节点。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#3f4d55" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#74838a"/></marker>
    <style>
      .bg{fill:#fbf7ef}
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27343b}
      .sub{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#66737b}
      .panel{fill:#fffdf8;stroke:#ded6ca;stroke-width:1.4;filter:url(#shadow)}
      .ph{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .box{filter:url(#shadow);stroke-width:1.3}
      .n{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2c3940}
      .nt{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7a8790}
      .line{stroke:#74838a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .warn{font:500 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#b3796a}
      .good{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#4f8a69}
      .footer{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#34454d}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="54" text-anchor="middle">LangGraph 不可替代的核心：它是「图编排层」，不是「Agent 黑盒」</text>
  <text class="sub" x="640" y="88" text-anchor="middle">企业项目从来不是纯 AI 的——已有的数据库、支付、短信代码，怎么和 AI 拼在一起？</text>

  <!-- 左：Agent 黑盒 -->
  <rect class="panel" x="66" y="120" width="558" height="454" rx="26"/>
  <text class="ph" x="345" y="166" text-anchor="middle">其他框架：以 Agent 为中心</text>

  <rect class="box" x="235" y="196" width="220" height="86" rx="24" fill="#3a3f44" stroke="#2c3035"/>
  <text class="n" x="345" y="232" text-anchor="middle" fill="#f1ede4">Agent 黑盒</text>
  <text class="nt" x="345" y="258" text-anchor="middle" fill="#b9c0c5">推理 + 工具调用</text>

  <rect class="box" x="104" y="360" width="150" height="66" rx="16" fill="#f4eae2" stroke="#d8b6a8"/>
  <text class="n" x="179" y="392" text-anchor="middle">查库 SQL</text><text class="nt" x="179" y="410" text-anchor="middle">包装成 tool</text>
  <rect class="box" x="270" y="360" width="150" height="66" rx="16" fill="#f4eae2" stroke="#d8b6a8"/>
  <text class="n" x="345" y="392" text-anchor="middle">支付 API</text><text class="nt" x="345" y="410" text-anchor="middle">包装成 tool</text>
  <rect class="box" x="436" y="360" width="150" height="66" rx="16" fill="#f4eae2" stroke="#d8b6a8"/>
  <text class="n" x="511" y="392" text-anchor="middle">短信接口</text><text class="nt" x="511" y="410" text-anchor="middle">包装成 tool</text>
  <path class="line" d="M179 358 C179 320, 300 300, 335 284"/>
  <path class="line" d="M345 358 V286"/>
  <path class="line" d="M511 358 C511 320, 390 300, 355 284"/>

  <text class="warn" x="345" y="474" text-anchor="middle">传统业务只能硬塞成工具 / 回调</text>
  <text class="warn" x="345" y="504" text-anchor="middle">流程被藏进模型的推理里，不可见、不可控</text>
  <text class="warn" x="345" y="534" text-anchor="middle">想插人工审核？得改 Agent 内部</text>

  <!-- 右：图编排层 -->
  <rect class="panel" x="656" y="120" width="558" height="454" rx="26"/>
  <text class="ph" x="935" y="166" text-anchor="middle">LangGraph：以图为中心</text>

  <rect class="box" x="686" y="212" width="104" height="60" rx="14" fill="#e9eff7" stroke="#a1b3c8"/><text class="n" x="738" y="240" text-anchor="middle">查库</text><text class="nt" x="738" y="258" text-anchor="middle">SQL</text>
  <rect class="box" x="806" y="212" width="104" height="60" rx="14" fill="#edf3ef" stroke="#9fb5aa"/><text class="n" x="858" y="240" text-anchor="middle">AI 评估</text><text class="nt" x="858" y="258" text-anchor="middle">LLM</text>
  <rect class="box" x="926" y="212" width="104" height="60" rx="14" fill="#e9eff7" stroke="#a1b3c8"/><text class="n" x="978" y="240" text-anchor="middle">支付</text><text class="nt" x="978" y="258" text-anchor="middle">API</text>
  <rect class="box" x="1046" y="212" width="132" height="60" rx="14" fill="#f4eae2" stroke="#d8b6a8"/><text class="n" x="1112" y="240" text-anchor="middle">人工审核</text><text class="nt" x="1112" y="258" text-anchor="middle">interrupt</text>
  <path class="line" d="M790 242 H804"/>
  <path class="line" d="M910 242 H924"/>
  <path class="line" d="M1030 242 H1044"/>

  <rect class="box" x="806" y="330" width="258" height="58" rx="14" fill="#eef1e9" stroke="#b4bfa9"/><text class="n" x="935" y="365" text-anchor="middle">短信通知（传统接口，直接当节点）</text>
  <path class="line" d="M978 274 C978 300, 935 306, 935 328"/>

  <text class="good" x="935" y="440" text-anchor="middle">传统代码和 AI 代码是平等的一等节点</text>
  <text class="good" x="935" y="470" text-anchor="middle">整个流程在一张图里平铺直叙、可见可控</text>
  <text class="good" x="935" y="500" text-anchor="middle">加人工审核 = add_node + add_edge 两行</text>
  <text class="good" x="935" y="530" text-anchor="middle">已有业务函数一行不改，直接进图</text>

  <rect x="250" y="602" width="780" height="52" rx="26" fill="#ffffff" stroke="#d8cec1"/>
  <text class="footer" x="640" y="635" text-anchor="middle">图不关心节点是传统业务还是 AI，它只负责编排——这是 LangGraph 的本质区别。</text>
</svg>
